# Starts two containers: the MySQL database (db) and the dashboard (app)
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql          # keeps your tables even after you stop Docker
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"                        # open http://localhost:8501
    environment:
      DB_HOST: db                          # the dashboard finds MySQL by this name
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: 2048
    depends_on:
      db:
        condition: service_healthy         # wait until MySQL is ready

volumes:
  mysql_data:
